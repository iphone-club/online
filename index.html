<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>feed</title>

    <link rel="icon" type="image/png" href="/favicon.png?v=3">
    <link rel="preload" as="image" href="images/henntumblr_lqrquvfZB81qbxj23o1_1280.png" fetchpriority="high">
    
    <style>
        body {
            margin: 0;
            font-family: Arial;
            overflow-x: hidden;
        }

        /* фоновое видео */
        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0);
            z-index: -1;
        }

        /* ---------- Кнопка "Next →" ---------- */
        .forward-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100000;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            height: 30px;
            line-height: 30px;
            padding: 0 14px;
            background: rgba(0,0,0,0.5);
            border-radius: 0px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            box-sizing: border-box;
        }
        .forward-link:hover {
            background: rgba(0,0,0,0.8);
        }

        /* ---------- Плеер ---------- */
        .audio-player {
            position: fixed;
            top: 60px;
            left: 20px;
            z-index: 99999;
            display: flex;
            align-items: center;
            gap: 12px;
            height: 30px;
            padding: 0 20px;
            background: rgba(10, 10, 10, 0.6);
            border-radius: 0px;
            border: 1px solid rgba(255,255,255,0.2);
            box-sizing: border-box;
            user-select: none;
        }

        .play-btn {
            width: 22px;
            height: 22px;
            padding: 0;
            border: none;
            outline: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s;
        }
        .play-btn:active {
            transform: scale(0.9);
        }
        .play-btn svg {
            width: 16px;
            height: 16px;
            fill: #fff;
        }

        .progress-container {
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.25);
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        #audio {
            display: none;
        }

        /* ---------- НОВАЯ ССЫЛКА-КАРТИНКА ВНИЗУ СЛЕВА ---------- */
        .corner-link {
            position: fixed;
            bottom: 20px;
            left: 20px;                    /* выровнено как плеер и кнопка */
            z-index: 100000;
            display: block;
            line-height: 0;
        }
        .corner-link img {
            height: 35px;                  /* как у плеера */
            width: auto;
            display: block;
            border: none;
            opacity: 0.9;
            transition: opacity 0.2s;
        }
        .corner-link:hover img {
            opacity: 1;
        }

        /* ---------- Masonry ---------- */
        .feed {
            line-height: 0;
            column-count: 4;
            column-gap: 10px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            transform: translateZ(0);
        }

        @media (min-width: 1200px) {
            .feed {
                padding-left: 200px;
                padding-right: 200px;
            }
        }

        @media (max-width: 768px) {
            .feed {
                column-count: 3;
                column-gap: 9px;
                padding-left: 18px;
                padding-right: 18px;
                padding-top: 82px;
                padding-bottom: 26px;
            }
            .post {
                margin-bottom: 10px;
            }
            .forward-link {
                top: 12px;
                left: 18px;
                font-size: 12px;
                height: 26px;
                line-height: 26px;
                padding: 0 10px;
            }
            .audio-player {
                top: 46px;
                left: 18px;
                height: 26px;
                padding: 0 14px;
                gap: 8px;
            }
            .play-btn {
                width: 20px;
                height: 20px;
            }
            .play-btn svg {
                width: 14px;
                height: 14px;
            }
            .progress-container {
                width: 120px;
            }
            /* мобильная версия corner-link */
            .corner-link {
                left: 18px;                /* как у кнопки и плеера */
                bottom: 12px;
            }
            .corner-link img {
                height: 30px;              /* как у мобильной кнопки */
            }
        }

        .post {
            display: inline-block;
            width: 100%;
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            margin-bottom: 10px;
        }

        .post img,
        .post video {
            width: 100%;
            height: auto;
            display: block;
            vertical-align: top;
            cursor: pointer;
        }
        /* ---------- Лайтбокс ---------- */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100001;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            cursor: pointer;
            user-select: none;
            border: 2px solid rgba(255,255,255,0.2);
        }
    </style>
</head>

        <div class="post"><img loading="lazy" decoding="async" src="images/forrei.jpg"></div>
    </div>

    <!-- Лайтбокс -->
    <div class="lightbox" id="lightbox">
        <img src="" alt="" id="lightboxImg">
    </div>

    <script>
        // ---------- Плеер ----------
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const iconPlay = document.getElementById('iconPlay');
        const iconPause = document.getElementById('iconPause');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                iconPlay.style.display = 'none';
                iconPause.style.display = '';
            } else {
                audio.pause();
                iconPlay.style.display = '';
                iconPause.style.display = 'none';
            }
        }

        playBtn.addEventListener('click', togglePlay);

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = percent + '%';
            }
        });

        progressContainer.addEventListener('click', (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const fraction = Math.max(0, Math.min(1, clickX / rect.width));
            if (audio.duration) {
                audio.currentTime = fraction * audio.duration;
            }
        });

        audio.addEventListener('ended', () => {
            iconPlay.style.display = '';
            iconPause.style.display = 'none';
        });

        audio.addEventListener('error', () => {
            console.warn('Аудио не загрузилось, проверь путь к audio.mp3');
        });

        // ---------- Лайтбокс / Слайдшоу ----------
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        const allImages = Array.from(document.querySelectorAll('.feed .post img'));
        let currentIndex = -1;

        function openLightbox(index) {
            if (index < 0 || index >= allImages.length) return;
            currentIndex = index;
            lightboxImg.src = allImages[currentIndex].src;
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxImg.src = '';
            currentIndex = -1;
        }

        function nextImage() {
            if (currentIndex === -1) return;
            currentIndex = (currentIndex + 1) % allImages.length;
            lightboxImg.src = allImages[currentIndex].src;
        }

        function prevImage() {
            if (currentIndex === -1) return;
            currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
            lightboxImg.src = allImages[currentIndex].src;
        }

        allImages.forEach((img, idx) => {
            img.addEventListener('click', (e) => {
                e.stopPropagation();
                openLightbox(idx);
            });
        });

        lightboxImg.addEventListener('click', (e) => {
            e.stopPropagation();
            nextImage();
        });

        lightbox.addEventListener('click', () => {
            closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevImage();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                nextImage();
            }
        });
    </script>

</body>
</html>
